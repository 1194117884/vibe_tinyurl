[package]
name = "vibe_tinyurl"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono"] }
bb8-redis = "0.18"
redis = { version = "0.27", features = ["tokio-comp", "json"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
once_cell = "1.19"
rand = "0.8"

[lib]
name = "vibe_tinyurl"
path = "src/lib.rs"
